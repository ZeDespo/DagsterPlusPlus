[project]
name = "dagster-eigen"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dagster>=1.13.18",
    "dagster-docker>=0.29.18",
    "dagster-postgres>=0.29.18",
    "dagster-webserver>=1.13.18",
    "psycopg>=3.3.4",
]

[project.scripts]
dagster-eigen = "dagster_eigen:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dagster-dg-cli>=1.13.18",
]

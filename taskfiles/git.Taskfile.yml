---
version: '3'

vars:
    VERSION:
        sh: uv version --short

tasks:
    add_remote:
        cmd: git remote add {{.REMOTE_NAME}} {{.REMOTE_URL}}
        desc: Add some remote git repository with a specified name as an upstream / downstream.
        ignore_error: true
        vars:
            REMOTE_NAME: '{{.REMOTE_NAME | default ""}}'
            REMOTE_URL: '{{.REMOTE_URL | default ""}}'
    fetch-changes-from-remote:
        cmds:
          - git fetch {{.REMOTE_NAME}}
          - git merge --no-ff --no-commit {{.REMOTE_NAME}}/main
        internal: true
        vars:
            REMOTE_NAME: '{{.REMOTE_NAME | default ""}}'
    fetch-latest-changes-from-forked-repository:
        cmds:
          - task: fetch-changes-from-remote
            vars:
                REMOTE_NAME: '{{.DOWNSTREAM_NAME}}'
        desc: Fetch the latest changes from some forked (downstream) repository's main branch.
            This taskfile command will *NOT* merge any changes in ``client_plugins`` into
            the main repo. If you want to have your plugin be reusable, add it to the ``plugins/library``
            instead.
        preconditions:
          - msg: You are already in {{.DOWNSTREAM_NAME}}. Use `git pull origin main` instead.
            sh: test {{.PROJECT}} != {{.DOWNSTREAM_NAME}}
        vars:
            DOWNSTREAM_NAME: '{{.DOWNSTREAM_NAME | default ""}}'
    new-release:
        cmds:
          - git pull
          - git tag v{{.VERSION}} {{.CLI_ARGS}}
          - git push origin tag v{{.VERSION}} {{.CLI_ARGS}}
        desc: Create a new tag for the code and push it to the git repo. CI/CD will build
            a new release. Assumes you created a new version with ``poetry version major/minor/patch``.
        preconditions:
          - sh: test $(git rev-parse --abbrev-ref HEAD) == main
            msg: Cannot make a new release on a branch other than main.
        vars:
            VERSION:
                sh: uv version --short
    update-version:
        cmds:
          - sed -i '' "s/DOCKER_VERSION.*/DOCKER_VERSION={{.VERSION}}/" .env.template
          - find deployment/docker -name "*.env" | xargs sed -i '' "s/DOCKER_VERSION.*/DOCKER_VERSION={{.VERSION}}/"
        desc: Keep the .env files consistent with the version found in `pyproject.toml`. You
            will rarely call this yourself, should be handled by a pre-commit hook.
        vars:
            VERSION:
                sh: uv version --short
